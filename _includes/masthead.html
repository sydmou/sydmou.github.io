<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="primary-navigation" class="grouped-nav" aria-label="Main navigation">
        <ul class="nav-groups">
          {% for group in site.data.navigation.main %}
            <li>
              <details class="nav-group">
                <summary>{{ group.title }}<span class="nav-chevron" aria-hidden="true"></span></summary>
                <ul class="nav-submenu" aria-label="{{ group.title }} links">
                  {% for link in group.links %}
                    <li><a href="{{ link.url | relative_url }}"{% if link.primary %} class="nav-home-link"{% endif %}>{{ link.title }}</a></li>
                  {% endfor %}
                </ul>
              </details>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
